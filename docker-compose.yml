services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: solution_studio
      POSTGRES_USER: solution_studio
      POSTGRES_PASSWORD: solution_studio
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solution_studio -d solution_studio"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://solution_studio:solution_studio@postgres:5432/solution_studio
      ORCHESTRATOR_BASE_URL: http://host.docker.internal:18000
      ARTIFACT_BASE_PATH: /wp3-artifacts
      ARTIFACT_BASE_PATHS: /denmark-artifacts
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Platform Administrator}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
    ports:
      - "${API_PORT:-18080}:8080"
    volumes:
      - wp3_artifacts:/wp3-artifacts:ro
      - wp3_artifacts:/app/data:ro
      - denmark_node_data:/denmark-artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - services

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_ENVIRONMENT_LABEL: ${NEXT_PUBLIC_ENVIRONMENT_LABEL:-Local environment}
    environment:
      INTERNAL_API_URL: http://api:8080
    ports:
      - "${WEB_PORT:-13000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  wp3_artifacts:
    external: true
  denmark_node_data:
    external: true
    name: denmark-node-data

networks:
  services:
    external: true
    name: ai-effect-services
