# Prepared only. No shared demo networks, volumes, profiles or evidence mounts.
name: ${STAGING_PROJECT_NAME:?Choose a new isolated staging project name}
services:
  postgres:
    image: ${STAGING_POSTGRES_IMAGE:?Supply an approved immutable PostgreSQL image}
    pull_policy: never
    environment:
      POSTGRES_DB: design_ai_staging
      POSTGRES_USER: staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Supply a new staging-only secret}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U staging -d design_ai_staging']
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: ${STAGING_API_IMAGE:?Build the reviewed candidate and supply its immutable image}
    pull_policy: never
    environment:
      DATABASE_URL: postgresql+psycopg://staging:${STAGING_POSTGRES_PASSWORD}@postgres:5432/design_ai_staging
      ORCHESTRATOR_BASE_URL: ${STAGING_WP3_URL:?Supply the separately approved staging WP3 endpoint}
      ORCHESTRATOR_API_KEY: ${STAGING_WP3_API_KEY:-}
      SECURE_COOKIES: "true"
      BOOTSTRAP_ADMIN_EMAIL: ${STAGING_BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${STAGING_BOOTSTRAP_PASSWORD:-}
      SERVICE_CONTRACT_PATH: /service-contracts
      DESIGN_AI_ENABLED: "false"
      DESIGN_AI_TEMPLATES: '{}'
      DESIGN_AI_DUTCH_DEMO: "false"
      AIE37_QUALIFICATION: "false"
      AIE18_EVIDENCE_ROOT: ""
      LOCAL_DUTCH_EVIDENCE_ROOT: ""
      LOCAL_DUTCH_AUTO_CAPTURE_ROOT: ""
      LOCAL_DUTCH_CAPTURE_RUNTIME: ""
      OPENAI_API_KEY: ""
      DESIGN_AI_ACCEPTANCE_BUDGET_FILE: ""
      DESIGN_AI_ACCEPTANCE_TASK_LIMIT_FILE: ""
      DESIGN_AI_DEMO_EXECUTION_GRANT_FILE: ""
    volumes:
      - contracts:/service-contracts
    networks: [private]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    image: ${STAGING_WEB_IMAGE:?Build the reviewed candidate for this API route and supply its immutable image}
    pull_policy: never
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8080
    networks: [private]
    depends_on: [api]
  gateway:
    image: ${STAGING_GATEWAY_IMAGE:?Supply an approved immutable nginx image}
    pull_policy: never
    ports:
      - "127.0.0.1:${STAGING_GATEWAY_PORT:?Choose an unused staging-only loopback port}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private]
    depends_on: [web]
networks:
  private:
    internal: true
volumes:
  database:
  contracts:
