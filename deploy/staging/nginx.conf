# An authenticated application is still required. These denials are additional
# staging boundaries, not substitutes for application authorization.
server {
    listen 8443 ssl;
    ssl_certificate /tls/localhost.crt;
    ssl_certificate_key /tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    client_max_body_size 10m;

    location ~ ^/api/workflows/submit-to-orchestrator/?$ { return 403; }
    location ~ ^/api/workflows/submit/?$ { return 403; }
    location ~ ^/api/design-ai/drafts/[^/]+/execute/?$ { return 403; }
    location ~ ^/api/design-ai/chat/?$ { return 403; }
    location ~ ^/api/workflows/runtime-preflight/?$ { return 403; }
    location ~ ^/api/services/[^/]+/runtime/verify/?$ { return 403; }
    location ~ ^/api/services/import/preview/?$ { return 403; }
    # The inherited arbitrary-reference preview is authenticated, but does not
    # establish per-workflow ownership. Keep it closed in shared staging.
    location ~ ^/api/data-references/preview/?$ { return 403; }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
