services:
  clickhouse-server:
    ports: !reset []
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${PORTUGAL_CLICKHOUSE_PASSWORD:?Set PORTUGAL_CLICKHOUSE_PASSWORD}

  data-provision:
    ports: !reset []
    environment:
      CLICKHOUSE_HOST: clickhouse-server
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${PORTUGAL_CLICKHOUSE_PASSWORD:?Set PORTUGAL_CLICKHOUSE_PASSWORD}
      SELF_URL: http://pt-data-provision:600
    networks:
      tef-network:
        aliases:
          - pt-data-provision
    volumes:
      - ./data/real_data.csv:/app/real_data.csv:ro
    tmpfs:
      - /app/data_raw:uid=1000,gid=1000,mode=0750
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:600/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  knowledge-store:
    ports: !reset []
    environment:
      SELF_URL: http://pt-knowledge-store:8000
      DATA_PROVISION_URL: http://pt-data-provision:600
    networks:
      tef-network:
        aliases:
          - pt-knowledge-store
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  synthetic-data:
    container_name: pt-synthetic-data
    ports: !reset []
    environment:
      ML_GRETEL_PORT: "600"
      ML_GRETEL_RELOAD: "False"
      SELF_URL: http://pt-synthetic-data:600
    networks:
      tef-network:
        aliases:
          - pt-synthetic-data
    volumes:
      - portugal_synthetic_models:/app/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:600/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  portugal_synthetic_models:
    name: portugal-synthetic-models

networks:
  tef-network:
    name: ai-effect-services
    external: true
    driver: !reset null
