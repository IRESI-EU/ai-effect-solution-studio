# R1 manual execution candidate only. Preserve API auth/ownership/preflight.
# This is a NEW overlay, never a modification to retained design-only staging.
server {
    listen 8443 ssl;
    ssl_certificate /tls/localhost.crt;
    ssl_certificate_key /tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    client_max_body_size 10m;
    # R1 carries no AI authority. Deny both new saved-solution and old AI routes.
    location ~ ^/api/design-ai(?:/|$) { return 403; }
    # Arbitrary-reference preview does not establish deployment ownership.
    location ~ ^/api/data-references/preview/?$ { return 403; }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
