# Prepared R1 overlay for deploy/staging/compose.yaml. Not permission to start it.
# Owner-approved runtime/data/contracts and operator review remain required.
services:
  api:
    environment:
      DATABASE_SCHEMA_MODE: validate
      STAGING_REVIEW_SEED: ""
      BOOTSTRAP_ADMIN_EMAIL: ""
      BOOTSTRAP_ADMIN_PASSWORD: ""
      DESIGN_AI_ENABLED: "false"
      DESIGN_AI_RESTRICTED_BETA: "false"
      DESIGN_AI_LOCAL_PILOT: "false"
      DESIGN_AI_MODEL: ""
      OPENAI_API_KEY: ""
      DESIGN_AI_SCOPED_ACCEPTANCE_FILE: ""
      DESIGN_AI_ACCEPTANCE_BUDGET_FILE: ""
      DESIGN_AI_ACCEPTANCE_TASK_LIMIT_FILE: ""
      DESIGN_AI_DEMO_EXECUTION_GRANT_FILE: ""
      DESIGN_AI_BUDGET_AUTHORITY_TOKEN: ""
      PORTUGUESE_SUPERVISED_MODE: "false"
      PORTUGUESE_EVIDENCE_ROOT: ""
      PORTUGUESE_MODEL_ROOT: ""
      ORCHESTRATOR_BASE_URL: ${R1_ORCHESTRATOR_URL:?Supply the reviewed isolated R1 WP3 URL}
      ORCHESTRATOR_API_KEY: ${R1_ORCHESTRATOR_KEY:?Supply a private R1-only WP3 key}
      ORCHESTRATOR_SERVICES_API_KEY: ${R1_SERVICE_KEY:?Supply the private reviewed Control service key}
      OWNED_CONTROL_TARGETS_FILE: /run/r1/control-targets.json
    volumes:
      - ${R1_CONTROL_TARGETS_FILE:?Install the reviewed private endpoint/observation target declaration}:/run/r1/control-targets.json:ro
    networks: [private, r1_runtime]
  gateway:
    volumes:
      # Compose paths resolve relative to the FIRST file (deploy/staging).
      - ../release/r1-nginx.conf:/etc/nginx/conf.d/default.conf:ro
networks:
  r1_runtime:
    external: true
    name: ${R1_RUNTIME_NETWORK:?Supply the operator-reviewed isolated WP3/Control network; never the raw ML network}
